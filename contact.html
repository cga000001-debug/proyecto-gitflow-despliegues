<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Píxeles y Sombras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>
    <header class="mi-header">
        <div class="logo">
            <h1>Píxeles y Sombras</h1>
        </div>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="gallery.html">Galería</a>
            <a href="aboutUs.html">About us</a>
            <a href="contact.html" class="activo">Contacto</a>
        </nav>
    </header>

    <div id="content">
        <section class="contact-info">
            <h2>Contacto</h2>

            <div class="contact-item">
                <h3>Email</h3>
                <p>info@pixelesysombras.com</p>
            </div>

            <div class="contact-item">
                <h3>Teléfono</h3>
                <p>+34 600 123 456</p>
            </div>

            <div class="contact-item">
                <h3>Dirección</h3>
                <p>Rúa Principal 25, A Coruña, España</p>
            </div>

            <div class="contact-item">
                <h3>Horario</h3>
                <p>Lunes - Viernes: 09:00 - 18:00</p>
            </div>
        </section>
    </div>

    <div id="content">
        <section class="contact-form-container">
            <h2>Envíanos un mensaje</h2>

            <form action="#" method="POST">
                <div class="field-group form-full-width">
                    <label class="label" for="nombre">Nombre:</label>
                    <input class="input" type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                </div>

                <div class="field-group form-full-width">
                    <label class="label" for="email">Email:</label>
                    <input class="input" type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>

                <div class="field-group form-full-width">
                    <label class="label" for="asunto">Asunto:</label>
                    <input class="input" type="text" id="asunto" name="asunto" placeholder="¿En qué podemos ayudarte?">
                </div>

                <div class="field-group form-full-width">
                    <label class="label" for="mensaje">Mensaje:</label>
                    <!-- Usamos la clase input, pero siendo un textarea -->
                    <textarea class="input textarea-input" id="mensaje" name="mensaje" required
                        placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>

                <div class="button-row form-full-width" style="margin-top: 20px;">
                    <button type="submit" class="button-primary">Enviar Mensaje</button>
                </div>
            </form>
    </div>

    <footer>
        <img src="" alt="Píxeles y Sombras">
        <nav>
            <a href="./index.html">Home</a>
            <a href="./aboutUs.html">About Us</a>
            <a href="./gallery.html">Gallery</a>
            <a href="./contact.html">Contact</a>
        </nav>
        <p class="version">Versión 1.0.0</p>
    </footer>
</body>

</html>
