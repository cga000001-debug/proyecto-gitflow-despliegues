<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Píxeles y Sombras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="mi-header">
        <div class="logo">
            <h1>Píxeles y Sombras</h1>
        </div>
        <nav class="menu">
            <a href="index.html" class="activo">Inicio</a>
            <a href="aboutUs.html">About us</a>
            <a href="contact.html">Contacto</a>
            <a href="gallery.html">Galería</a>
        </nav>
    </header>

    <div class="carrusel-auto" id="carrusel-auto">
        <div class="carrusel-auto-pista" id="pista">
        <img src="imagenes/carrusel-automatico-1.jpg" alt="Foto 1">
        <img src="imagenes/carrusel-automatico-2.jpg" alt="Foto 2">
        <img src="imagenes/carrusel-automatico-3.jpg" alt="Foto 3">
        <img src="imagenes/carrusel-automatico-4.jpg" alt="Foto 4">
        <img src="imagenes/carrusel-automatico-5.jpg" alt="Foto 5">
        <img src="imagenes/carrusel-automatico-6.jpg" alt="Foto 6">
        <img src="imagenes/carrusel-automatico-7.jpg" alt="Foto 7">
        <img src="imagenes/carrusel-automatico-8.jpg" alt="Foto 8">
        <img src="imagenes/carrusel-automatico-9.jpg" alt="Foto 9">
        <img src="imagenes/carrusel-automatico-10.jpg" alt="Foto 10">
        </div>

        <button class="carrusel-auto-flecha izquierda" id="anterior" aria-label="Imagen anterior">&#10094;</button>
        <button class="carrusel-auto-flecha derecha" id="siguiente" aria-label="Imagen siguiente">&#10095;</button>

        <div class="carrusel-auto-puntos" id="puntos"></div>
    </div>

    <script src="carrusel-automatico.js"></script>

    <div id = "form_newsletter">
        <form class="newsletter-card" action="#" method="post">

            <h2 class="title">Únete a nuestra newsletter</h2>

            <p class="subtitle">Ideas, promociones y actividades una vez por semana. Sin spam, cancela cuando quieras.</p>

            <div class="field-group">
            <label class="label" for="nombre">Nombre</label>
            <input class="input" type="text" id="nombre" name="nombre" placeholder="Tu nombre">
            </div>

            <div class="field-group">
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="tu@email.com">
            </div>

            <div class="checkbox-group">
            <label class="checkbox-row" for="aceptar">
                <input class="checkbox-input" type="checkbox" id="aceptar" name="aceptar" checked>
                <span class="checkbox-label">Acepto recibir correos y la política de privacidad.</span>
            </label>
            </div>

            <div class="button-row">
            <button class="button-primary" type="submit">Suscribirme</button>
            </div>

            <p class="terms">Al suscribirte, aceptas nuestras condiciones y términos de uso.</p>

        </form>
    </div>
</body>

</html>
